services:
  soundtouch:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    network_mode: host
    environment:
      - PORT=3000
      - LOG_LEVEL=debug
      # Speaker discovery (disable if not using host networking)
      - DISCOVERY_ENABLED=${DISCOVERY_ENABLED:-true}
      # Manual speaker IPs (comma-separated host:port, optional)
      - SPEAKER_HOSTS=${SPEAKER_HOSTS:-}
      # Spotify (optional — leave blank to disable)
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-http://127.0.0.1:3000/auth/spotify/callback}
      # Optional PIN to protect the web UI
      # - PIN=1234
    volumes:
      # Mount source code for hot reload
      - ../packages:/app/packages:cached
      - ../package.json:/app/package.json:ro
      - ../pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ../pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ../turbo.json:/app/turbo.json:ro
      # Persist node_modules (don't override with host)
      - node_modules:/app/node_modules
      - soundtouch_data:/data
    restart: unless-stopped

volumes:
  node_modules:
  soundtouch_data:
